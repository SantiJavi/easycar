# Perfil "test": base de datos en memoria para que las pruebas no dependan de Postgres.
spring.datasource.url=jdbc:h2:mem:easycar-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Seguridad (clave solo para pruebas)
security.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1lYXN5Y2FyLXVuaXQtdGVzdHMtMTIzNDU2Nzg5MA==
security.jwt.expiration-ms=3600000

# CORS
app.cors.allowed-origins=*

# Swagger activo para verificar /v3/api-docs
springdoc.api-docs.enabled=true
