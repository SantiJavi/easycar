# Perfil de produccion: todo por variables de entorno (Northflank / Docker).
# Activar con SPRING_PROFILES_ACTIVE=prod

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Base de datos (Neon) ---
# DB_URL debe incluir sslmode=require y, si se usa el pooler de Neon,
# prepareThreshold=0 (PgBouncer en modo transaccion no soporta sentencias preparadas).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Seguridad ---
# Base64 de al menos 32 bytes: openssl rand -base64 48
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS: dominios del frontend separados por coma ---
app.cors.allowed-origins=${CORS_ORIGINS}

# --- Alta de usuarios: vacio = registro deshabilitado ---
app.registro.codigo=${REGISTRO_CODIGO:}

# --- Swagger apagado en produccion (se puede habilitar con SWAGGER_ENABLED=true) ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# --- Arranque liviano en contenedores pequenos ---
spring.main.banner-mode=off
spring.jmx.enabled=false
spring.devtools.restart.enabled=false

logging.level.root=INFO
logging.level.com.auto.app.easycar=INFO
logging.level.org.hibernate.SQL=WARN
