spring.application.name=easycar
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/easycar
spring.datasource.username=admin
spring.datasource.password=santiago
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Evita N+1 al serializar las colecciones anidadas (tipos de mantenimiento / historial)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# CORS: origenes permitidos separados por coma ("*" permite todos).
# En produccion reemplace "*" por el dominio del frontend, p. ej. https://app.easycar.com
app.cors.allowed-origins=*

# Seguridad - JWT
# Clave secreta en Base64 (minimo 32 bytes). Cambiela y no la versione en repositorios publicos.
security.jwt.secret=qnWRrGyCUvypRIfZC+VlqshL8asEsdGlLlqn/7u12qk+aJlUE8IyfZ/pUjmyGx8uDJk8mVanuEnHzUQGQymwvA==
# Vigencia del token en milisegundos (86400000 = 24 horas)
security.jwt.expiration-ms=86400000

# Alta de usuarios: /auth/register exige este codigo (variable REGISTRO_CODIGO).
# Si queda vacio, el registro de nuevos usuarios esta deshabilitado.
# Se ignoran espacios en los extremos, comillas y mayusculas/minusculas.
# Para produccion conviene moverlo a la variable REGISTRO_CODIGO y no versionarlo.
app.registro.codigo=Santiago0718

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
